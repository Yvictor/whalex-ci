name: Publish reviewed WhaleX release notes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Production vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      source_sha:
        description: Exact 40-character private source SHA running in Production
        required: true
        type: string
      confirmation:
        description: Enter PUBLISH RELEASE NOTES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: whalex-public-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Validate immutable production identity and CI evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH RELEASE NOTES"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          evidence_tag="ci-$SOURCE_SHA"
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$evidence_tag/ci-manifest.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$evidence_tag" \
            | jq -e --arg tag "$evidence_tag" --arg url "$expected_url" '
              .tag_name == $tag and .draft == false and .prerelease == false and
              (.assets | length) == 1 and .assets[0].name == "ci-manifest.json" and
              (.assets[0].size >= 100 and .assets[0].size <= 4096) and
              .assets[0].browser_download_url == $url
            ' >/dev/null
          evidence="$RUNNER_TEMP/ci-manifest.json"
          gh release download "$evidence_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern ci-manifest.json --output "$evidence"
          jq -e --arg sha "$SOURCE_SHA" '
            .schema_version == 1 and .source_repository == "private" and
            .source_sha == $sha and .conclusion == "success" and
            ((.suites | sort) == ["backend","frontend","repository"]) and
            (.run_url | test("^https://github\\.com/Yvictor/whalex-ci/actions/runs/[1-9][0-9]*$"))
          ' "$evidence" >/dev/null
          run_id="$(jq -r '.run_url | split("/")[-1]' "$evidence")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            | jq -e '
              .status == "completed" and .conclusion == "success" and
              .head_branch == "main" and .path == ".github/workflows/ci.yml" and
              .repository.full_name == "Yvictor/whalex-ci"
            ' >/dev/null
          build_json="$(curl --fail --silent --show-error --max-time 15 https://whalexstock.com/whalex-build.json)"
          test "$(jq -r '.commit_sha // empty' <<<"$build_json")" = "$SOURCE_SHA"
          test "$(jq -r '.release_tag // empty' <<<"$build_json")" = "$RELEASE_TAG"
      - name: Read only the reviewed note from exact private source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHALEX_SOURCE_DEPLOY_KEY: ${{ secrets.WHALEX_SOURCE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WHALEX_SOURCE_DEPLOY_KEY" | scripts/private-source-git.sh checkout "$SOURCE_SHA" "$RUNNER_TEMP/source"
          note="$RUNNER_TEMP/source/docs/releases/$RELEASE_TAG.md"
          test -f "$note" && test ! -L "$note"
          size="$(stat -c '%s' "$note")"
          test "$size" -ge 20 && test "$size" -le 51200
          python3 - "$note" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          blocked = {
              "private key": r"-----BEGIN [A-Z ]*PRIVATE KEY-----",
              "email address": r"(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",
              "internal path": r"/(?:srv|home)/[^\s)`]+",
              "secret file": r"(?:\.sec|\.env(?:\.[A-Za-z0-9_-]+)?)\b",
              "internal host": r"(?i)\b(?:r9950|x3970)\b",
              "credential assignment": r"(?i)\b(?:password|secret|token|api[_-]?key)\s*[:=]",
          }
          for label, pattern in blocked.items():
              if re.search(pattern, text):
                  raise SystemExit(f"release note rejected: contains {label}")
          PY
          install -m 0600 "$note" "$RUNNER_TEMP/release-note.md"
          rm -rf -- "$RUNNER_TEMP/source"
      - name: Publish approved note without source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "股鯨 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-note.md"
