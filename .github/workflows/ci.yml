# The private checkout credential is destroyed before project commands run.
name: WhaleX private-source CI
run-name: WhaleX CI ${{ inputs.source_sha || github.event.client_payload.source_sha || 'private-main' }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from Yvictor/whalex; blank resolves private main
        required: false
        type: string
      force:
        description: Re-run even when a passing evidence release exists
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - whalex-ci
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: whalex-public-ci-${{ inputs.source_sha || github.event.client_payload.source_sha || 'private-main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable private source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      already_passed: ${{ steps.evidence.outputs.already_passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Resolve and validate source SHA
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          API_SHA: ${{ github.event.client_payload.source_sha }}
          WHALEX_SOURCE_DEPLOY_KEY: ${{ secrets.WHALEX_SOURCE_DEPLOY_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${DISPATCH_SHA:-${API_SHA:-}}"
          if test -z "$source_sha"; then
            source_sha="$(printf '%s' "$WHALEX_SOURCE_DEPLOY_KEY" | scripts/private-source-git.sh resolve-main)"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
      - name: Check immutable passing evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          FORCE_INPUT: ${{ inputs.force }}
          FORCE_API: ${{ github.event.client_payload.force }}
        shell: bash
        run: |
          set -euo pipefail
          force="${FORCE_INPUT:-${FORCE_API:-false}}"
          already_passed=false
          if test "$force" != true && gh release view "ci-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            evidence="$RUNNER_TEMP/ci-manifest.json"
            if gh release download "ci-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
                --pattern ci-manifest.json --output "$evidence" >/dev/null 2>&1 \
              && jq -e --arg sha "$SOURCE_SHA" '
                .schema_version == 1 and
                .source_repository == "private" and
                .source_sha == $sha and
                .conclusion == "success" and
                ((.suites | sort) == ["backend","frontend","repository"]) and
                (.checked_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")) and
                (.run_url | test("^https://github\\.com/Yvictor/whalex-ci/actions/runs/[1-9][0-9]*$"))
              ' "$evidence" >/dev/null; then
              run_id="$(jq -r '.run_url | split("/")[-1]' "$evidence")"
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  | jq -e '
                    .status == "completed" and .conclusion == "success" and
                    .head_branch == "main" and .path == ".github/workflows/ci.yml" and
                    .repository.full_name == "Yvictor/whalex-ci"
                  ' >/dev/null; then
                already_passed=true
              fi
            fi
          fi
          echo "already_passed=$already_passed" >>"$GITHUB_OUTPUT"

  frontend:
    name: Frontend typecheck and build
    needs: resolve
    if: needs.resolve.outputs.already_passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Checkout exact private source and destroy credential
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WHALEX_SOURCE_DEPLOY_KEY: ${{ secrets.WHALEX_SOURCE_DEPLOY_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
        working-directory: .
        shell: bash
        run: printf '%s' "$WHALEX_SOURCE_DEPLOY_KEY" | scripts/private-source-git.sh checkout "$SOURCE_SHA" "$GITHUB_WORKSPACE/source"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install dependencies without publishing private-source output
        shell: bash
        run: npm ci >"$RUNNER_TEMP/frontend-install.log" 2>&1 || { echo "frontend dependency installation failed" >&2; exit 1; }
      - name: Typecheck
        shell: bash
        run: npx tsc --noEmit >"$RUNNER_TEMP/frontend-typecheck.log" 2>&1 || { echo "frontend typecheck failed; inspect locally in the private repository" >&2; exit 1; }
      - name: Production build
        env:
          APP_ENV: production
          PUBLIC_BASE_URL: https://whalexstock.com
          ROBOTS_INDEX: "true"
        shell: bash
        run: npm run build >"$RUNNER_TEMP/frontend-build.log" 2>&1 || { echo "frontend build failed; inspect locally in the private repository" >&2; exit 1; }
      - name: Analytics browser-block contract
        shell: bash
        run: npm run qa:analytics >"$RUNNER_TEMP/frontend-analytics.log" 2>&1 || { echo "frontend analytics contract failed; inspect locally in the private repository" >&2; exit 1; }

  backend:
    name: Backend lint and tests
    needs: resolve
    if: needs.resolve.outputs.already_passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/backend-python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Checkout exact private source and destroy credential
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WHALEX_SOURCE_DEPLOY_KEY: ${{ secrets.WHALEX_SOURCE_DEPLOY_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
        working-directory: .
        shell: bash
        run: printf '%s' "$WHALEX_SOURCE_DEPLOY_KEY" | scripts/private-source-git.sh checkout "$SOURCE_SHA" "$GITHUB_WORKSPACE/source"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244
        with:
          version: "0.8.3"
          enable-cache: false
      - name: Install Python and dependencies without publishing private-source output
        shell: bash
        run: |
          uv python install 3.12 >"$RUNNER_TEMP/backend-python.log" 2>&1 || { echo "Python installation failed" >&2; exit 1; }
          uv sync --frozen --group dev >"$RUNNER_TEMP/backend-install.log" 2>&1 || { echo "backend dependency installation failed" >&2; exit 1; }
      - name: Python syntax check
        shell: bash
        run: uv run python -m compileall -q app scripts research/scripts >"$RUNNER_TEMP/backend-compile.log" 2>&1 || { echo "backend syntax check failed; inspect locally in the private repository" >&2; exit 1; }
      - name: Backend tests
        shell: bash
        run: uv run pytest -q >"$RUNNER_TEMP/backend-tests.log" 2>&1 || { echo "backend tests failed; inspect locally in the private repository" >&2; exit 1; }
      - name: Data pipeline tests
        shell: bash
        run: uv run pytest -q ../tools/tests >"$RUNNER_TEMP/pipeline-tests.log" 2>&1 || { echo "data pipeline tests failed; inspect locally in the private repository" >&2; exit 1; }
      - name: Windmill generated-script and schedule contracts
        shell: bash
        run: uv run pytest -q ../tools/windmill/tests >"$RUNNER_TEMP/windmill-tests.log" 2>&1 || { echo "Windmill contract tests failed; inspect locally in the private repository" >&2; exit 1; }

  repository:
    name: Repository and Compose validation
    needs: resolve
    if: needs.resolve.outputs.already_passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - name: Checkout exact private source and destroy credential
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WHALEX_SOURCE_DEPLOY_KEY: ${{ secrets.WHALEX_SOURCE_DEPLOY_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: printf '%s' "$WHALEX_SOURCE_DEPLOY_KEY" | scripts/private-source-git.sh checkout "$SOURCE_SHA" "$GITHUB_WORKSPACE/source"
      - name: Patch and shell syntax
        working-directory: source
        shell: bash
        run: |
          git diff --check HEAD^ >"$RUNNER_TEMP/repository-diff.log" 2>&1 || { echo "repository diff validation failed; inspect privately" >&2; exit 1; }
          bash -n ops/*.sh >"$RUNNER_TEMP/repository-shell.log" 2>&1 || { echo "shell syntax validation failed; inspect privately" >&2; exit 1; }
      - name: Staging Compose config
        working-directory: source
        shell: bash
        run: docker compose --env-file .env.staging.example -f docker-compose.yml config --quiet >"$RUNNER_TEMP/staging-compose.log" 2>&1 || { echo "Staging Compose validation failed; inspect privately" >&2; exit 1; }
      - name: Production Compose config
        working-directory: source
        shell: bash
        run: |
          docker compose --env-file .env.production.example \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f docker-compose.cloudflare.production.yml \
            config --quiet >"$RUNNER_TEMP/production-compose.log" 2>&1 \
            || { echo "Production Compose validation failed; inspect privately" >&2; exit 1; }

  record:
    name: Publish immutable CI evidence
    needs:
      - resolve
      - frontend
      - backend
      - repository
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.already_passed != 'true' &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.repository.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create sanitized evidence release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          manifest="$RUNNER_TEMP/ci-manifest.json"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg checked_at "$checked_at" \
            --arg run_url "$run_url" \
            '{schema_version:1,source_repository:"private",source_sha:$source_sha,checked_at:$checked_at,run_url:$run_url,conclusion:"success",suites:["frontend","backend","repository"]}' \
            >"$manifest"
          if gh release view "ci-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-ci-manifest.json"
            existing_valid=false
            if gh release download "ci-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
                --pattern ci-manifest.json --output "$existing" >/dev/null 2>&1 \
              && jq -e --arg sha "$SOURCE_SHA" '
                .schema_version == 1 and .source_repository == "private" and
                .source_sha == $sha and .conclusion == "success" and
                ((.suites | sort) == ["backend","frontend","repository"]) and
                (.run_url | test("^https://github\\.com/Yvictor/whalex-ci/actions/runs/[1-9][0-9]*$"))
              ' "$existing" >/dev/null; then
              existing_run_id="$(jq -r '.run_url | split("/")[-1]' "$existing")"
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$existing_run_id" \
                  | jq -e '
                    .status == "completed" and .conclusion == "success" and
                    .head_branch == "main" and .path == ".github/workflows/ci.yml" and
                    .repository.full_name == "Yvictor/whalex-ci"
                  ' >/dev/null; then
                existing_valid=true
              fi
            fi
            if test "$existing_valid" = true; then
              echo "Existing immutable evidence remains valid; forced tests passed without replacing it."
              exit 0
            fi
            # Keep the protected ci-* tag stable. --cleanup-tag can delete the
            # release first and then fail to delete the protected tag, leaving
            # an avoidable evidence gap.
            gh release delete "ci-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "ci-$SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WhaleX CI $SOURCE_SHA" \
            --notes "Private source commit \`$SOURCE_SHA\` passed the public Frontend, Backend, and Repository CI suites. No application source or source-derived artifact is attached. Run: $run_url" \
            "$manifest#ci-manifest.json"
